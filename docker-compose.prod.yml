services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - smart_chess_pgdata:/var/lib/postgresql/data
      - ./backend/postgresql/schemas/db_1.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_CONNECTION: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STOCKFISH_PATH: /usr/games/stockfish
    volumes:
      - ./backend/configs/static_config.yaml:/app/configs/static_config.yaml:ro
      - ./backend/configs/config_vars.docker.yaml:/app/configs/config_vars.docker.yaml:ro
    command:
      [
        "/app/backend",
        "--config",
        "/app/configs/static_config.yaml",
        "--config_vars",
        "/app/configs/config_vars.docker.yaml"
      ]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  smart_chess_pgdata: